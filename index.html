<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MATCH LAB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="MATCH LAB: testes, relatórios e guias para escolher raquete de tênis, tênis de corrida e prancha de surf.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Syne:wght@800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;700&family=Sora:wght@600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: bancada de laboratório da família Match. Azul-petróleo como base, cada app com sua cor (bola, mar, asfalto); relatório real como prova. */
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --sunk:#EAEAE7; --ink:#0A0A0A; --muted:#5C5C58; --line:#DCDCD7;
  --petrol:#0A0A0A; --on-petrol:#FFFFFF; --petrol-soft:#BDBDB8; --lime:#FFFFFF; --ink-on-color:#0B2530; --tri:linear-gradient(90deg,#DDF247 0 33.3%,#6CCFF6 33.3% 66.6%,#FF8A3D 66.6%);
  --racket:#DDF247; --board:#6CCFF6; --tenis:#FF8A3D;
  --area:#BDBDB8;
  --f-display:"Archivo","Helvetica Neue",system-ui,sans-serif;
  --f-brand:"Syne","Arial Black",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --wrap:1180px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1A1A1A; --sunk:#161616; --ink:#F2F2F0; --muted:#A3A3A0; --line:#2E2E2C;
  --petrol:#F2F2F0; --on-petrol:#0A0A0A; --petrol-soft:#8A8A86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1A1A1A; --sunk:#161616; --ink:#F2F2F0; --muted:#A3A3A0; --line:#2E2E2C;
  --petrol:#F2F2F0; --on-petrol:#0A0A0A; --petrol-soft:#8A8A86; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.015em}
.a-racket{--area:var(--racket)} .a-board{--area:var(--board)} .a-tenis{--area:var(--tenis)}

/* Logos */
.ico{display:block;flex:none}
.wordmark{font-family:var(--f-brand);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.lockup{display:flex;align-items:center;gap:10px;text-decoration:none}
.lockup .wm{display:flex;flex-direction:column;gap:3px}
.lockup .wm small{font-family:var(--f-body);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:66px}
.top .lockup .wordmark{font-size:19px;letter-spacing:.06em}
.top{border-bottom:0}.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--tri)}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav a{text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:500;font-size:.93rem;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sunk);font-weight:700}
.nav .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.menu-btn{display:none;margin-left:auto;background:var(--sunk);border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
@media (max-width:980px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .nav.open{display:flex}
  .nav a{padding:12px;font-size:1rem}
  .nav .sep{width:auto;height:1px;margin:4px 0}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-weight:700;padding:13px 20px;min-height:48px;border-radius:12px;border:0;cursor:pointer;transition:transform .15s ease,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(.97)}
.btn-area{background:var(--area);color:var(--ink-on-color)}
.btn-petrol{background:var(--petrol);color:var(--on-petrol)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn .arr{font-family:var(--f-mono);font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

main{display:block;min-height:60vh}
section{padding-block:72px}
@media (max-width:640px){section{padding-block:52px}}
.shead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:30px}
.shead h2{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:800;max-width:20em;margin-top:8px}
.shead p{color:var(--muted);max-width:36em;margin:10px 0 0}

/* Report frame */
.report{position:relative;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 24px 48px -28px rgba(11,37,48,.45);overflow:hidden;min-width:0}
.report .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.report .bar .dots{display:flex;gap:5px}
.report .bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.report .bar .url{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.report .bar .pill{font-size:.7rem;font-weight:700;background:var(--area);color:var(--ink-on-color);padding:3px 8px;border-radius:99px;white-space:nowrap}
.report .shot{display:block;width:100%;height:var(--h,460px);overflow:hidden;position:relative;background:#EEF4F5;cursor:zoom-in;border:0;padding:0}
.report .shot img{display:block;width:100%;height:auto}
.report .shot::after{content:"";position:absolute;inset:auto 0 0;height:90px;background:linear-gradient(transparent,#EEF4F5)}
.report .zoom{position:absolute;right:14px;bottom:14px;z-index:2;background:#0A0A0A;color:#fff;font-size:.8rem;font-weight:700;padding:8px 12px;border-radius:99px;pointer-events:none}
@media (max-width:600px){.report .shot{height:min(var(--h,460px),420px)}}

/* HERO */
.hero{padding-block:56px 64px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
@media (max-width:940px){.hero-grid{grid-template-columns:minmax(0,1fr);gap:36px}}
.hero h1{overflow-wrap:anywhere}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.4rem);font-weight:800;margin-top:14px}
.hero h1 .hl{background:var(--tri) left bottom/100% .14em no-repeat;padding:0 .02em .04em}
.hero .lede{font-size:1.15rem;color:var(--muted);max-width:32em;margin:20px 0 28px}
.pickers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
@media (max-width:520px){.pickers{grid-template-columns:1fr}}
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;min-width:0}
.pick:hover{border-color:var(--ink)}
.pick b{display:block;font-size:.92rem}
.pick span{display:block;font-size:.78rem;color:var(--muted)}
.hero-report .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.hero-report .tabs .lbl{font-size:.8rem;color:var(--muted);margin-right:4px}
.hero-report .tabs button{display:flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-size:.84rem;font-weight:700;cursor:pointer}
.hero-report .tabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.hero-report .cap{font-size:.84rem;color:var(--muted);margin:10px 0 0}

.cta-big{display:flex;align-items:center;gap:18px;width:100%;max-width:560px;background:var(--petrol);color:var(--on-petrol);border:0;border-radius:14px;padding:20px 24px;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,2.4vw,1.7rem);letter-spacing:-.01em;text-align:left;position:relative;overflow:hidden;transition:transform .15s}
.cta-big::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--tri)}
.cta-big:hover{transform:translateY(-2px)}
.cta-big .icons{display:flex;gap:6px;margin-left:auto}
.cta-big .arr{font-family:var(--f-mono);font-weight:500}
@media (max-width:520px){.cta-big .icons{display:none}.cta-big .arr{margin-left:auto}}
.vars{display:grid;gap:12px}
.vars .vl{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.vars p{margin:0;font-size:.92rem;line-height:1.5}
.vars ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.vars li{font-family:var(--f-mono);font-size:.74rem;background:color-mix(in srgb,var(--area) 30%,var(--surface));padding:5px 9px;border-radius:6px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:14px}
.calc .soon{margin:0;font-size:.85rem;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.inside.solo{grid-template-columns:minmax(0,1fr)}.inside.solo > div{max-width:820px}
.chooser{background:#0A0A0A;color:#F2F2F0;border-radius:20px;padding:28px;display:grid;gap:18px;position:relative;overflow:hidden;border:1px solid var(--line)}
.chooser::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--tri)}
.chooser h2{font-size:clamp(1.9rem,3.6vw,2.7rem);font-weight:800;color:#fff}
.chooser > p{margin:0;font-size:.88rem;color:#A3A3A0}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;border-radius:14px;background:#1A1A1A;border:1.5px solid #2E2E2C;color:#fff;text-decoration:none;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--area);transform:translateX(3px)}
.tile .tn{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tn b{font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.tile .tn span{font-size:.88rem;color:#A3A3A0}
.tile .go{margin-left:auto;font-weight:700;font-size:.88rem;background:var(--area);color:#0B2530;padding:9px 14px;border-radius:99px;white-space:nowrap}
@media (max-width:480px){.tile .go{display:none}.tile .tn b{font-size:1.15rem}}
.model{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:center}
@media (max-width:900px){.model{grid-template-columns:minmax(0,1fr)}}
.muted-p{color:var(--muted);margin:0 0 24px;max-width:34em}
.mtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.mtabs button{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;font-weight:700;font-size:.9rem;cursor:pointer}
.mtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbox{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;text-decoration:none;transition:border-color .15s,transform .15s}
.toolbox:hover{border-color:#6CCFF6;transform:translateY(-2px)}
.tb-ic{width:52px;height:52px;border-radius:14px;background:#0E4D64;display:grid;place-items:center}
.tb-ic svg{width:26px;height:26px;fill:none;stroke:#6CCFF6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tb-tx small{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tb-tx b{font-family:var(--f-display);font-size:1.25rem}
.tb-tx span{color:var(--muted);font-size:.93rem}
.tb-go{background:#6CCFF6;color:#0B2530;font-weight:700;padding:11px 16px;border-radius:12px;white-space:nowrap}
.toolbox.mini{grid-template-columns:44px minmax(0,1fr);padding:14px 16px;gap:12px}
.toolbox.mini .tb-ic{width:44px;height:44px}.toolbox.mini .tb-go{display:none}.toolbox.mini .tb-tx b{font-size:1.02rem}
@media (max-width:620px){.toolbox{grid-template-columns:44px minmax(0,1fr)}.toolbox .tb-go{grid-column:1/-1;text-align:center}.tb-ic{width:44px;height:44px}}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.skip{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:-80px;z-index:1000;background:#0A0A0A;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}
main:focus{outline:none}
[tabindex="-1"]:focus{outline:none}
.crumbs a{padding-block:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.area{background:color-mix(in srgb,var(--area) 30%,var(--surface))}}
:root[data-theme="dark"] .chip.area{background:color-mix(in srgb,var(--area) 30%,var(--surface))}
/* Area cards */
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:940px){.areas{grid-template-columns:1fr}}
.area-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.area-card .banner{background:#0E4D64;padding:26px 22px;display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff}
.area-card .banner .wordmark{font-size:1.5rem;color:#fff}
.area-card .banner .wordmark em{font-style:normal;color:var(--area)}
.area-card .banner small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#B9DCE3;margin-top:6px}
.area-card .body{padding:22px;display:flex;flex-direction:column;gap:14px;flex:1}
.area-card .q{font-size:1.05rem;margin:0}
.area-card ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.area-card li{font-family:var(--f-mono);font-size:.74rem;background:var(--sunk);padding:5px 9px;border-radius:6px}
.area-card .meta{font-size:.86rem;color:var(--muted)}
.area-card .row{margin-top:auto}
.area-card .btn{flex:1 1 auto;padding:12px 14px}

/* Concept band */
.band{background:#0A0A0A;color:#F2F2F0;border-block:1px solid var(--line)}
.band .eyebrow{color:#9E9E9A}
.band .shead p{color:#BDBDB8}
.steps{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid transparent;border-image:var(--tri) 1}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.step{padding:24px 24px 24px 0;border-right:1px solid rgba(255,255,255,.2)}
.step:last-child{border-right:0}
.step + .step{padding-left:24px}
@media (max-width:820px){.step,.step + .step{padding:20px 0;border-right:0;border-bottom:1px solid rgba(255,255,255,.2)}}
.step .n{font-family:var(--f-mono);color:#9E9E9A;font-size:.8rem}
.step h3{font-size:1.3rem;margin:10px 0 6px;font-weight:700}
.step p{margin:0;color:#BDBDB8}
.principles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:36px}
@media (max-width:700px){.principles{grid-template-columns:1fr}}
.principle{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;background:rgba(255,255,255,.07);padding:16px 18px;border-radius:12px}
.principle .ck{width:24px;height:24px;border-radius:50%;background:#FFFFFF;color:#0A0A0A;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.principle b{display:block;margin-bottom:2px}
.principle span{color:#BDBDB8;font-size:.95rem}

/* Roadmap */
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.roadmap{grid-template-columns:repeat(2,1fr)}}
@media (max-width:440px){.roadmap{grid-template-columns:1fr}}
.rm{border:1.5px dashed var(--line);border-radius:12px;padding:16px}
.rm .eyebrow{font-size:11px}
.rm b{display:block;font-family:var(--f-display);font-size:1.1rem;margin:6px 0 4px}
.rm p{margin:0;color:var(--muted);font-size:.9rem}

/* Article cards */
.grid-a{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:980px){.grid-a{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.grid-a{grid-template-columns:1fr}}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s;min-width:0}
.acard:hover{border-color:var(--ink);transform:translateY(-2px)}
.acard .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.chip.area{background:color-mix(in srgb,var(--area) 45%,var(--surface));color:var(--ink)}
.acard h3{font-size:1.18rem;font-weight:700;line-height:1.2}
.acard p{margin:0;color:var(--muted);font-size:.95rem}
.acard .foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}

/* Hub */
.hub-hero{padding-block:48px 52px;border-bottom:1px solid var(--line)}
.hub-hero .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center}
@media (max-width:900px){.hub-hero .grid{grid-template-columns:1fr;gap:32px}}
.hub-hero .lockup .wordmark{font-size:1.35rem}
.hub-hero h1{font-size:clamp(2.3rem,5vw,3.8rem);font-weight:800;margin:22px 0 16px}
.hub-hero h1 .hl{background:linear-gradient(transparent 60%,var(--area) 60%);padding:0 .06em}
.hub-hero p.lede{color:var(--muted);font-size:1.1rem;max-width:32em;margin:0 0 24px}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.facts div b{display:block;font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.facts div span{font-size:.84rem;color:var(--muted)}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none;align-items:center}
.subnav button{flex:none;background:transparent;border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.subnav button:hover{background:var(--sunk);color:var(--ink)}

.search{flex:1 1 260px;min-width:0;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 14px}

.glossary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}

/* Article */
.article{padding-block:36px 72px}

.art-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.art-head h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;max-width:20em}

.pn a.next{text-align:right}

/* Lightbox */
[hidden]{display:none!important}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:flex;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 60px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}

  board:{key:"board", name:"Board Match", w1:"Board", sport:"Prancha de surf", cls:"a-board",

function reportFrame(k, h){
  const a = AREAS[k];
  return `<div class="report ${a.cls}"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">matchlab.com.br/${k}/relatorio</span><span class="pill">${a.name}</span></div>

function acard(x){
  const a = ar(x);

function vars(a){

/* ---------- HUB ---------- */
let hubFilter = "todos", curHub = null;
function hub(k){
  const a = AREAS[k];
  return `<div class="${a.cls}">
  <section class="hub-hero"><div class="wrap grid">
    <div>
      <div class="lockup">${appLockup(k,44)}</div>
      <h1>${a.h1}</h1>
      <p class="lede">${a.lede}</p>
      <div class="row"><a class="btn btn-area" href="${a.quiz}">Fazer o teste grátis <span class="arr">→</span></a><button class="btn btn-ghost" type="button" data-scroll="relatorio">Ver o relatório</button></div>
      <div class="facts">${a.facts.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>
    </div>
    ${true ? reportFrame(k, 440) : `<div class="calc ${a.cls}"><div class="eyebrow">Variáveis do teste</div>${vars(a)}<p class="soon">Relatório de exemplo em breve.</p></div>`}
  </div></section>
  ${k==="board"?`<section style="padding-block:28px 0"><div class="wrap">${TOOLBOX}</div></section>`:""}
  <nav class="subnav" aria-label="Nesta página"><div class="wrap">
    <button type="button" data-scroll="relatorio">O relatório</button>
    <button type="button" data-scroll="guias">Guias (${byArea(k).length})</button>
    <button type="button" data-scroll="glossario">Glossário</button>
    <a class="go" href="${a.quiz}">Fazer o teste →</a>
  </div></nav>
  <section id="relatorio"><div class="wrap inside">
    <div>
      <div class="eyebrow">O que vem no relatório</div>
      <h2 style="font-size:clamp(1.8rem,3.4vw,2.5rem);margin:8px 0 22px">Tudo explicado, nada empurrado.</h2>
      <ol>${a.inside.map(([t,d],i)=>`<li><span class="k">${i+1}</span><div><b>${t}</b><span>${d}</span></div></li>`).join("")}</ol>
      <div class="price">${a.price.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>
    </div>
    ${reportFrame(k, 640)}
  </div></section>
  <section id="guias" style="padding-top:0"><div class="wrap">
    <div class="shead"><div><div class="eyebrow">${byArea(k).length} guias</div><h2>Guias ${a.name}</h2></div></div>
    <div class="filters" role="group" aria-label="Filtrar por categoria">
      ${["todos",...Object.keys(CATS)].map(c=>`<button type="button" data-filter="${c}" aria-pressed="${c===hubFilter}">${c==="todos"?"Todos":CATS[c]}</button>`).join("")}
      <span class="count" id="hubCount" aria-live="polite"></span>
    </div>
    <div class="grid-a" id="hubGrid"></div>
  </div></section>
  <section id="glossario" style="padding-top:0"><div class="wrap">
    <div class="shead"><div><div class="eyebrow">Glossário rápido</div><h2>Os termos que mais confundem.</h2></div></div>
    <div class="glossary">${a.gloss.map(([t,d])=>`<div><b>${t}</b><span>${d}</span></div>`).join("")}</div>
  </div></section></div>`;
}
function fillHub(k){
  const list = byArea(k).filter(x => hubFilter==="todos" || x.cat===hubFilter);
  document.getElementById("hubGrid").innerHTML = list.map(acard).join("") || `<div class="empty">Nenhum guia nesta categoria ainda.</div>`;
  document.getElementById("hubCount").textContent = list.length + (list.length===1?" guia":" guias");
}

/* ---------- LIBRARY ---------- */
let libArea = "todas", libQ = "";
function library(){
  return `<section class="hub-hero" style="padding-bottom:40px"><div class="wrap">
    <div class="lockup">${labLockup(44)}</div>
    <h1 style="max-width:16em">Tudo o que a ficha técnica não explica.</h1>
    <p class="lede">${A.length} guias sobre como escolher, por que escolher certo importa, a evolução de cada esporte e as tecnologias por trás do equipamento.</p>
  </div></section>
  <section style="padding-top:36px"><div class="wrap">
    <div class="filters" role="group" aria-label="Filtrar blog">
      <button type="button" data-lib="todas" aria-pressed="${libArea==="todas"}">Todos</button>
      ${ORDER.map(k=>`<button type="button" data-lib="${k}" aria-pressed="${k===libArea}">${ICON[k](20)}${AREAS[k].name}</button>`).join("")}
      <label class="search" for="q"><span aria-hidden="true">⌕</span><input id="q" type="search" aria-label="Buscar no blog" placeholder="Buscar: drop, litragem, RA…" value="${esc(libQ)}"></label>
      <span class="count" id="libCount" aria-live="polite"></span>
    </div>
    <div id="libBody"></div>
  </div></section>`;
}
function fillLib(){
  const q = libQ.trim().toLowerCase();
  const list = A.filter(x => (libArea==="todas"||DATA2KEY[x.area]===libArea) && (!q || (x.title+" "+x.dek+" "+x.tags.join(" ")).toLowerCase().includes(q)));
  const body = document.getElementById("libBody");
  document.getElementById("libCount").textContent = list.length + (list.length===1?" guia":" guias");
  if(!list.length){ body.innerHTML = `<div class="empty">Nada encontrado para “${esc(libQ)}”. Tente outro termo.</div>`; return; }
  body.innerHTML = Object.keys(CATS).map(c=>{
    const g = list.filter(x=>x.cat===c); if(!g.length) return "";
    return `<div style="margin-bottom:44px"><h2 style="font-size:1.5rem;margin-bottom:16px">${CATS[c]}</h2><div class="grid-a">${g.map(acard).join("")}</div></div>`;
  }).join("");
}

/* ---------- ARTICLE ---------- */
function article(id){
  const x = A.find(y=>y.id===id); if(!x) return null;
  const a = ar(x); const list = byArea(a.key); const i = list.indexOf(x);
  const prev = list[i-1], next = list[i+1];
  let hn = 0; const heads = [];
  const body = x.body.map(b=>{
    if(b.t==="p") return `<p>${esc(b.x)}</p>`;
    if(b.t==="h"){ hn++; heads.push(b.x); return `<h2 id="${x.id}-s${hn}">${esc(b.x)}</h2>`; }
    if(b.t==="ul") return `<ul>${b.items.map(it=>`<li>${esc(it)}</li>`).join("")}</ul>`;
    if(b.t==="tip") return `<div class="tip"><b>Dica</b><div>${esc(b.x)}</div></div>`;
    if(b.t==="quote") return `<blockquote>${esc(b.x)}</blockquote>`;
    if(b.t==="spec") return `<div class="spec"><div class="cap">${esc(b.caption||"Referência")}</div><div class="tw"><table>${b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div></div>`;
    return "";
  }).join("");
  const related = list.filter(y=>y!==x && y.cat===x.cat).concat(list.filter(y=>y!==x && y.cat!==x.cat)).slice(0,3);
  return `<div class="${a.cls}"><article class="article"><div class="wrap">
    <nav class="crumbs" aria-label="Você está em"><a href="#inicio" data-go="inicio">Início</a><span>/</span><a href="#${a.key}" data-go="${a.key}">${a.name}</a><span>/</span><span>${CATS[x.cat]}</span></nav>
    <div class="art-grid">
      <div style="min-width:0">
        <header class="art-head">
          <div class="meta">${ICON[a.key](24)}<span class="chip area">${a.sport}</span><span class="chip">${CATS[x.cat]}</span></div>
          <h1>${esc(x.title)}</h1><p class="dek">${esc(x.dek)}</p>
          <div class="by"><span>Nível: ${esc(x.level)}</span><span>${x.minutes} min de leitura</span><span>${x.tags.map(t=>"#"+esc(t)).join(" ")}</span></div>
        </header>
        <div class="prose">${body}</div>
        <div class="pn">
          ${prev?`<a href="#a-${prev.id}" data-go="a-${prev.id}"><small>← Anterior</small><b>${esc(prev.title)}</b></a>`:"<span></span>"}
          ${next?`<a class="next" href="#a-${next.id}" data-go="a-${next.id}"><small>Próximo →</small><b>${esc(next.title)}</b></a>`:""}
        </div>
      </div>
      <div class="side">
        ${a.key==="board"?TOOLBOX.replace('class="toolbox"','class="toolbox mini"'):""}
        <div class="cta-box">
          ${true?`<button type="button" class="thumb" data-zoom="${a.key}" aria-label="Ampliar relatório de exemplo do ${a.name}"><img src="${SHOTS[a.key]||""}" alt=""></button>`:""}
          <div class="in">
            <div class="lockup">${MARK[a.key](32)}<span class="wordmark">${a.w1} <em>Match</em></span></div>
            <p>${a.q}</p>
            <a class="btn btn-area" href="${a.quiz}">Fazer o teste grátis <span class="arr">→</span></a>
          </div>
        </div>
        ${heads.length?`<div class="toc"><div class="eyebrow">Neste guia</div><ol>${heads.map((h,j)=>`<li><button type="button" data-anchor="${x.id}-s${j+1}">${esc(h)}</button></li>`).join("")}</ol></div>`:""}
      </div>
    </div>
    <div style="margin-top:64px"><h2 style="font-size:1.5rem;margin-bottom:16px">Continue lendo</h2><div class="grid-a">${related.map(acard).join("")}</div></div>
  </div></article></div>`;
}

/* ---------- ROUTER ---------- */
const LEGACY = {raquete:"racket", prancha:"board", biblioteca:"blog"};
function setNav(view){
  const k = view.startsWith("a-") ? DATA2KEY[view.slice(2).split("-")[0]] : view;
  document.querySelectorAll(".nav a").forEach(a=>{ a.removeAttribute("aria-current"); if(a.dataset.go===k) a.setAttribute("aria-current","page"); });
}
let firstRender=true;
function say(t){const l=document.getElementById("a11yLive");l.textContent="";setTimeout(()=>{l.textContent=t},80)}
function render(view){
  view = LEGACY[view] || view || "inicio";
  let html, after;
  if(view==="inicio"||view==="conceito"){ html = home(); }
  else if(AREAS[view]){ hubFilter="todos"; curHub=view; html = hub(view); after=()=>fillHub(view); }
  else if(view==="blog"){ html = library(); after=fillLib; }
  else if(view.startsWith("a-")){ html = article(view.slice(2)); }
  if(!html){ view="inicio"; html=home(); }
  app.innerHTML = html; if(after) after();
  setNav(view);
  document.getElementById("nav").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  const t = view.startsWith("a-") ? (A.find(y=>y.id===view.slice(2))||{}).title : (AREAS[view]||{}).name;
  document.title = t ? t + " · MATCH LAB" : "MATCH LAB";
  if(view==="conceito"){ requestAnimationFrame(()=>document.getElementById("conceito").scrollIntoView()); }
  else window.scrollTo(0,0);
  try{ history.replaceState(null,"","#"+view); }catch(e){}
  if(!firstRender && view!=="conceito"){ const h=app.querySelector("h1"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } say("Página: "+document.title); }
  firstRender=false;
}
const lb = document.getElementById("lb");
let lbOpener=null;
function openLB(k){ lbOpener=document.activeElement; const im=document.getElementById("lbImg"); im.src = SHOTS[k]||""; im.alt = REPORT_DESC[k]; document.getElementById("lbCap").textContent = AREAS[k].name+" · relatório de exemplo"; lb.hidden=false; lb.scrollTop=0; document.getElementById("lbClose").focus(); }
function closeLB(){ lb.hidden=true; if(lbOpener&&lbOpener.isConnected) lbOpener.focus(); }
document.addEventListener("click", e=>{
  if(!lb.hidden){ if(e.target.id==="lbClose"||e.target===lb) closeLB(); return; }
  if(e.target.closest(".skip")){ e.preventDefault(); const h=app.querySelector("h1")||app; h.setAttribute("tabindex","-1"); h.focus(); return; }
  const z = e.target.closest("[data-zoom]"); if(z){ openLB(z.dataset.zoom); return; }
  const go = e.target.closest("[data-go]"); if(go){ e.preventDefault(); render(go.dataset.go); return; }
  const sc = e.target.closest("[data-scroll]"); if(sc){ e.preventDefault(); const el=document.getElementById(sc.dataset.scroll); if(el){ el.scrollIntoView(); const h=el.querySelector("h2,h1")||el; h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } return; }
  const an = e.target.closest("[data-anchor]"); if(an){ const el=document.getElementById(an.dataset.anchor); if(el){ el.scrollIntoView(); el.setAttribute("tabindex","-1"); el.focus({preventScroll:true}); } return; }
  const hr = e.target.closest("[data-hero]"); if(hr){ heroK=hr.dataset.hero; document.getElementById("modelBox").innerHTML=modelSec(); const nb=document.querySelector(`[data-hero="${heroK}"]`); if(nb) nb.focus(); say("Relatório de exemplo do "+AREAS[heroK].name); return; }
  const f = e.target.closest("[data-filter]"); if(f){ hubFilter=f.dataset.filter; document.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed", b===f)); fillHub(curHub); return; }
  const l = e.target.closest("[data-lib]"); if(l){ libArea=l.dataset.lib; document.querySelectorAll("[data-lib]").forEach(b=>b.setAttribute("aria-pressed", b===l)); fillLib(); return; }
});
document.addEventListener("keydown", e=>{ if(lb.hidden) return; if(e.key==="Escape") closeLB(); if(e.key==="Tab"){ e.preventDefault(); document.getElementById("lbClose").focus(); } });
document.addEventListener("input", e=>{ if(e.target.id==="q"){ libQ=e.target.value; fillLib(); } });
document.getElementById("menuBtn").addEventListener("click", function(){
  const n=document.getElementById("nav"); const o=n.classList.toggle("open"); this.setAttribute("aria-expanded", o);
});
window.addEventListener("hashchange", ()=>render(location.hash.slice(1)));
render(location.hash.slice(1));
})();
</script>
